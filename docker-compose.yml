version: '3.8'

networks:
  glms-network:
    driver: bridge

services:
  # Container 1: SQL Server Database
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password123
    ports:
      - "1433:1433"
    networks:
      - glms-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong@Password123", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Container 2: Backend API
  glms-backend-api:
    image: glms-backend-api:latest
    container_name: glms-backend-api
    build:
      context: ./Web_API
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sql-server-db;Database=GlmsDb;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;
    ports:
      - "5001:8080"
    networks:
      - glms-network
    depends_on:
      sql-server-db:
        condition: service_healthy

  # Container 3: Frontend Web App
  glms-frontend-web:
    image: glms-frontend-web:latest
    container_name: glms-frontend-web
    build:
      context: .  
      dockerfile: "./PROG7311 POE P2/Dockerfile" 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - HttpClientSettings__MyWebAPI=http://glms-backend-api:8080/
    ports:
      - "5000:8080"
    networks:
      - glms-network
    depends_on:
      - glms-backend-api